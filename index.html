<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>City Explorer – 2-Player Battle Royale</title>

    <!-- Leaflet -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

    <!-- Marker Cluster -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet.markercluster@1.4.1/dist/MarkerCluster.css" />
    <link rel="stylesheet" href="https://unpkg.com/leaflet.markercluster@1.4.1/dist/MarkerCluster.Default.css" />
    <script src="https://unpkg.com/leaflet.markercluster@1.4.1/dist/leaflet.markercluster-src.js"></script>

    <style>
        /* =========================
       GLOBAL LAYOUT
    ========================== */
        html,
        body {
            height: 100%;
            margin: 0;
            font-family: system-ui, -apple-system, BlinkMacSystemFont, sans-serif;
            background: #111;
            overflow: hidden;
        }

        #map {
            height: 100%;
            width: 100%;
        }

        /* =========================
       LOADING OVERLAY
    ========================== */
        #loadingOverlay {
            position: fixed;
            inset: 0;
            background: rgba(0, 0, 0, 0.85);
            display: none;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 9999;
            color: white;
            font-size: 1.2em;
            letter-spacing: 1px;
        }

        .spinner {
            width: 60px;
            height: 60px;
            border: 6px solid #333;
            border-top: 6px solid #00d4ff;
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin-bottom: 20px;
        }

        @keyframes spin {
            to {
                transform: rotate(360deg);
            }
        }

        /* =========================
       CONFIG PANEL
    ========================== */
        #configPanel {
            position: absolute;
            top: 15px;
            left: 15px;
            width: min(340px, 92vw);
            background: rgba(255, 255, 255, 0.98);
            border-radius: 14px;
            padding: 20px;
            z-index: 1000;
            box-shadow: 0 15px 40px rgba(0, 0, 0, 0.4);
            transition: all 0.3s ease;
        }

        #configPanel.game-active {
            opacity: 0.6;
            transform: scale(0.95);
        }

        .panel-header {
            margin-bottom: 15px;
            border-bottom: 1px solid #ddd;
            padding-bottom: 10px;
        }

        .panel-header h2 {
            margin: 0;
            font-size: 1.5em;
        }

        .panel-header p {
            margin: 5px 0 0;
            font-size: 0.85em;
            color: #666;
        }

        .config-item {
            margin-bottom: 15px;
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        label {
            font-weight: 600;
            font-size: 0.95em;
        }

        input[type="range"] {
            accent-color: #3498db;
        }

        .badge {
            background: #eef5ff;
            padding: 3px 8px;
            border-radius: 6px;
            font-weight: bold;
            color: #3498db;
        }

        .search-area {
            display: flex;
            gap: 6px;
        }

        #searchBox {
            flex: 1;
            padding: 10px;
            border-radius: 8px;
            border: 1px solid #ccc;
        }

        .btn {
            padding: 10px 16px;
            border-radius: 8px;
            border: none;
            font-weight: bold;
            cursor: pointer;
            transition: transform 0.15s, box-shadow 0.15s;
        }

        .btn:hover:not(:disabled) {
            transform: translateY(-1px);
            box-shadow: 0 6px 15px rgba(0, 0, 0, 0.25);
        }

        .btn:disabled {
            opacity: 0.5;
            cursor: default;
        }

        #startGameButton {
            background: linear-gradient(135deg, #00c853, #009624);
            color: white;
            font-size: 1.1em;
        }

        #endGameButton {
            background: #f44336;
            color: white;
        }

        #checkboxes label {
            background: #f2f2f2;
            padding: 6px 12px;
            border-radius: 20px;
            font-size: 0.85em;
            cursor: pointer;
        }

        /* =========================
       INVITE BOX
    ========================== */
        #inviteBox {
            margin-top: 12px;
            background: #eef5ff;
            padding: 10px;
            border-radius: 10px;
            font-size: 0.85em;
        }

        #inviteLink {
            word-break: break-all;
            color: #007bff;
        }

        /* =========================
       BOTTOM HUD
    ========================== */

        #bottom-bar {
            position: absolute;
            bottom: 0;
            width: 100%;
            background: linear-gradient(to right, #121212, #1e1e1e);
            padding: 12px 16px;
            display: grid;
            grid-template-columns: auto 1fr auto;
            align-items: center;
            z-index: 900;
            box-shadow: 0 -10px 30px rgba(0, 0, 0, 0.6);
            gap: 16px;
        }

        #player-huds {
            display: flex;
            gap: 20px;
        }

        .player-hud {
            background: #222;
            color: white;
            padding: 10px;
            border-radius: 10px;
            min-width: 180px;
            border: 1px solid #333;
        }

        .player-info {
            display: flex;
            justify-content: space-between;
            font-size: 0.9em;
        }

        progress {
            width: 100%;
            height: 16px;
        }

        #timer {
            justify-self: center;
            text-align: center;
            font-size: 1.2em;
            font-weight: bold;
            color: #00d4ff;
        }

        /* =========================
       SCOREBOARD
    ========================== */
        #scoreboardOverlay {
            position: fixed;
            inset: 0;
            background: rgba(0, 0, 0, 0.9);
            color: white;
            display: none;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 10000;
            text-align: center;
        }

        #scoreboardContent div {
            background: rgba(255, 255, 255, 0.1);
            padding: 10px 20px;
            margin: 6px 0;
            border-radius: 10px;
        }
    </style>
</head>

<body>
    <div id="map"></div>

    <div id="loadingOverlay">
        <div class="spinner"></div>
        <p>Preparing battlefield…</p>
    </div>

    <div id="scoreboardOverlay">
        <h2>🏆 Game Over</h2>
        <div id="scoreboardContent"></div>
        <button id="restartButton" class="btn">Restart</button>
    </div>

    <div id="configPanel">
        <div class="panel-header">
            <h2>🎮 Game Setup</h2>
            <p>Configure the battlefield</p>
        </div>

        <div class="config-item">
            <label>
                Initial Safe Zone:
                <span class="badge"><span id="radiusValue">6000</span> m</span>
            </label>
            <input id="radiusRange" type="range" min="1000" max="8000" step="500" value="6000" />
        </div>

        <div class="config-item">
            <label>
                Shrink Amount:
                <span class="badge"><span id="shrinkAmountValue">0.5</span> km</span>
            </label>
            <input id="shrinkAmountRange" type="range" min="0.1" max="2" step="0.1" value="0.5" />
        </div>

        <div class="config-item">
            <label>Center Location</label>
            <div class="search-area">
                <input id="searchBox" value="Karlsruhe" />
                <button id="searchButton" class="btn" style="background:#5cb85c;color:white">Search</button>
            </div>
        </div>

        <div class="config-item">
            <strong>Objectives</strong>
            <div id="checkboxes" style="display:flex;flex-wrap:wrap;gap:8px">
                <label><input type="checkbox" value="pub" checked /> Pub</label>
                <label><input type="checkbox" value="bar" checked /> Bar</label>
                <label><input type="checkbox" value="restaurant" checked /> Restaurant</label>
                <label><input type="checkbox" value="cafe" checked /> Café</label>
                <label><input type="checkbox" value="post_office" /> Post Office</label>
            </div>
        </div>

        <button id="startGameButton" class="btn">🚀 Start Game</button>

        <div id="inviteBox" style="display:none">
            <strong>Invite Player 2</strong><br />
            <a id="inviteLink" target="_blank"></a>
        </div>
    </div>

    <div id="bottom-bar">
        <div id="player-huds"></div>
        <div style="display:flex;gap:25px;align-items:center">
            <span id="timer">Next shrink in: --:--</span>
            <button id="endGameButton" class="btn" style="display:none">End Game</button>
        </div>
    </div>

    <script type="module">
        import { BattleRoyaleGame } from "./js/battleRoyalGame.js";
        const game = new BattleRoyaleGame();
        await game.store();
    </script>
</body>

</html>
